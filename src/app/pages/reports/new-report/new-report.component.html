<div class="card col-lg-12 col-xl-10">
  <div class="card-header">
    <div class="display-2">Generar</div>
  </div>
  <div class="card-body">
    <form [formGroup]="getReportForm" (submit)="submitForm()">
      <div class="row">
        <div class="col-md-12 col-lg-8">
          <div class="form-group">
            <label for="dpFromDate">Rango de fechas</label>
            <div class="dp-hidden position-absolute">
              <div class="input-group">
                <input placeholder="" name="datepicker" class="form-control" ngbDatepicker #datepicker="ngbDatepicker"
                  [autoClose]="'outside'" [navigation]="'select'" (dateSelect)="onDateSelection($event)"
                  [displayMonths]="2" [dayTemplate]="t" outsideDays="hidden" [startDate]="fromDate.value!"
                  tabindex="-1">
              </div>
            </div>

            <div class="input-group">
              <input #dpFromDate formControlName="fromDate" class="form-control" placeholder="dd-mm-yyyy"
                name="dpFromDate" [value]="formatter.format(fromDate.value)"
                (input)="fromDate.setValue(validateInput(fromDate.value, dpFromDate.value))">
              <input #dpToDate formControlName="toDate" class="form-control" placeholder="dd-mm-yyyy" name="dpToDate"
                [value]="formatter.format(toDate.value)"
                (input)="toDate.setValue(validateInput(toDate.value, dpToDate.value))">
              <div class="input-group-append">
                <button class="btn btn-simple btn-neutral" (click)="datepicker.toggle()" type="button"><i
                    class="fa-solid fa-calendar-days"></i></button>
              </div>
            </div>
            <div class="form-group">
              <label for="employee">Seleccione Encargado. <strong>Todos</strong> para reporte general
                <span class="col-auto col-form-label" *ngIf="loading">
                  <div class="sk-chase" style="font-size: 1em;">
                    <div class="sk-chase-dot"></div>
                    <div class="sk-chase-dot"></div>
                    <div class="sk-chase-dot"></div>
                    <div class="sk-chase-dot"></div>
                    <div class="sk-chase-dot"></div>
                    <div class="sk-chase-dot"></div>
                  </div>
                </span></label>
              <input name="employee" type="text" class="form-control" formControlName="selectedEmployee"
                [ngbTypeahead]="searchEmployee" [inputFormatter]="employeeInputFormatter" [resultTemplate]="rt"
                (focus)="focus$.next($any($event).target.value)" (click)="click$.next($any($event).target.value)"
                #instance="ngbTypeahead" />
            </div>
          </div>
        </div>
        <div class="col-md-12 col-lg-4 d-flex align-items-end justify-content-end">
          <div class="form-group text-right">
            <div class="form-group ml-3">
              <input type="checkbox" name="saveCheck" class="form-check-input" id="save" aria-describedby="save" formControlName="saveCheck">
              <label for="saveCheck">Guardar reporte</label>
          </div>
            <input name="search" type="submit" class="btn btn-simple btn-neutral m-0"
              formControlName="retrieveReportButton" />
          </div>
        </div>

      </div>

    </form>
  </div>
</div>

<ng-template #t let-date let-focused="focused">
  <span class="custom-day" [class.focused]="focused" [class.range]="isRange(date)"
    [class.faded]="isHovered(date) || isInside(date)" (mouseenter)="hoveredDate = date"
    (mouseleave)="hoveredDate = null">
    {{ date.day }}
  </span>
</ng-template>
<ng-template #rt let-r="result" let-t="term">
  <ngb-highlight [result]="r.uname" [term]="t"></ngb-highlight>
</ng-template>
